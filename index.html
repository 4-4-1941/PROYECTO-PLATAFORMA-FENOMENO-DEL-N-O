<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Anticipación El Niño · Gestión de riesgo</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div id="map"></div>

<!-- Panel lateral jerárquico (diseño aprobado) -->
<button id="toggleNav" title="Panel">≣</button>
<aside id="nav">
  <div id="navHead">
    <h1>Anticipación El Niño</h1>
    <p>Gestión de riesgo y acción comunitaria · Perú</p>
    <div class="copy">©SIP SYSTEM INTELLIGENCE PLATFORM 2026</div>
    <div id="searchBox">
      <div class="q-wrap">
        <input id="q" placeholder="Buscar departamento, provincia, distrito o UBIGEO…" autocomplete="off">
      </div>
      <div id="sug"></div>
    </div>
    <div id="oni"></div>
  </div>

  <div id="panel">
    <div id="placeCard">
      <div class="t" id="pTitle"></div>
      <div class="s" id="pSub"></div>
      <span class="badge-lg" id="pBadge"></span>
      <div class="d" id="pDetail"></div>
      <div class="a" id="pAccion"></div>
    </div>
    <div id="alerts"></div>
    <div id="jerarquia"></div>
  </div>

  <div id="fuentes"></div>
  <div id="navBody" style="display:none"></div>
</aside>

<!-- Leaflet -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.heat/0.2.0/leaflet-heat.js"></script>
<!-- Datos INEI (ya poblados) -->
<script src="data/departamento.js"></script>
<script src="data/provincia.js"></script>
<script src="data/distritos.js"></script>
<script src="data/centros_poblados.js"></script>
<script src="data/caserios.js"></script>
<!-- Módulos -->
<script src="js/map.js"></script>
<script src="js/oni.js"></script>
<script src="js/alerts.js"></script>
<script src="js/ui.js"></script>
<script src="js/weather.js"></script>
<script src="js/search.js"></script>
<script src="js/app.js"></script>
<script src="js/layers.js"></script>
</body>
</html>
