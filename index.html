<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;width:100%;overflow:hidden;font-family:"Segoe UI",Roboto,Arial,sans-serif;color:#1e293b}
#map{position:fixed;inset:0;width:100%;height:100%;z-index:1}
#nav{position:fixed;top:0;left:0;bottom:0;width:380px;max-width:90vw;z-index:1000;background:#fff;box-shadow:4px 0 24px rgba(15,23,42,.25);display:flex;flex-direction:column;transition:transform .25s}
#nav.closed{transform:translateX(-100%)}
#navHead{padding:16px;background:linear-gradient(135deg,#0f172a,#1e3a8a);color:#fff;flex-shrink:0}
#navHead h1{font-size:1.1rem;margin:0}
#navHead p{font-size:.72rem;opacity:.85;margin:2px 0 0}
#navHead .copy{opacity:.6;font-size:.6rem;margin-top:3px;color:#cbd5e1}
.q-wrap{position:relative;margin-top:10px}
#q{width:100%;padding:10px 34px 10px 14px;border:none;border-radius:20px;font-size:.9rem;outline:none;box-sizing:border-box}
.q-x{display:none;position:absolute;right:10px;top:50%;transform:translateY(-50%);background:none;border:none;font-size:1rem;cursor:pointer;color:#64748b;line-height:1;padding:4px}
.q-x.show{display:block}
#navBody{flex:1;overflow-y:auto;padding:10px}
#toggleNav{position:fixed;top:12px;left:392px;z-index:1500;background:#fff;border:none;border-radius:50%;box-shadow:0 2px 10px rgba(0,0,0,.2);width:38px;height:38px;font-size:1rem;cursor:pointer}
.it{padding:8px 11px;border-bottom:1px solid #eef2f6;cursor:pointer;font-size:.85rem;border-radius:6px}
.it:hover{background:#eff6ff}
.it.dep{font-weight:800;color:#0f172a;font-size:.92rem}.it.dep::before{content:"▾ "}
.it.prov{padding-left:22px;color:#334155;font-weight:600}.it.prov::before{content:"▸ "}.it.prov.open::before{content:"▾ "}
.it.dist{padding-left:44px;color:#475569;font-size:.8rem}.it.dist small{color:#94a3b8;font-size:.68rem}.it.dist:hover{background:#dbeafe}
.it .ub{background:#f1f5f9;border-radius:5px;padding:1px 6px;font-size:.66rem;color:#475569;margin-left:4px}
.loading{color:#94a3b8;font-style:italic;font-size:.75rem;padding:6px 11px}
/* Tarjeta de consulta (móvil operativo) */
#detalle{position:fixed;right:14px;top:14px;z-index:1500;width:330px;max-width:88vw;background:#fff;border-radius:12px;box-shadow:0 6px 20px rgba(0,0,0,.25);padding:14px;display:none;max-height:80vh;overflow-y:auto}
#detalle.show{display:block}
.dX{position:sticky;top:0;float:right;background:#f1f5f9;border:none;border-radius:50%;width:30px;height:30px;font-size:1rem;line-height:1;cursor:pointer;color:#64748b}
.dX:hover{background:#e2e8f0}
#detalle .t{font-size:1.1rem;font-weight:800;color:#0f172a;margin-top:4px}
#detalle .s{font-size:.78rem;color:#64748b;margin-top:2px}
#detalle .b{display:inline-block;margin-top:8px;padding:3px 12px;border-radius:14px;font-weight:700;font-size:.75rem;color:#fff}
#detalle .b.rojo{background:#dc2626}#detalle .b.naranja{background:#f59e0b}#detalle .b.verde{background:#16a34a}#detalle .b.bajo{background:#94a3b8}
#detalle .d{font-size:.8rem;color:#334155;margin-top:8px;line-height:1.6}
#detalle .a{background:#eff6ff;border-left:4px solid #2563eb;border-radius:6px;padding:8px 10px;margin-top:8px;font-size:.78rem;color:#1e40af}
/* Botón volver a consultar (móvil campo) */
.volver{display:block;width:100%;margin-top:10px;padding:9px;border:none;border-radius:8px;background:#0f172a;color:#fff;font-size:.82rem;font-weight:600;cursor:pointer}
@media(max-width:1024px){#nav{width:100%;max-width:100vw}#toggleNav{left:auto;right:14px}}

  function cerrar(){dd.classList.remove('show');}

  var dX=document.getElementById('dX');
  if(dX)dX.addEventListener('click',cerrarDetalle);
  function detalle(t,s,col,label,dtxt,act){document.getElementById('dtT').textContent=t;document.getElementById('dtS').textContent=s;document.getElementById('dtB').textContent=label;document.getElementById('dtB').className='b '+col;document.getElementById('dtD').innerHTML=dtxt;document.getElementById('dtA').innerHTML=act;dd.classList.add('show');}

      html+='<div class="it dep" data-nom="'+dep+'">'+dep+(open?'':' <small style="font-weight:400;color:#94a3b8">▸</small>')+'</div>';

        if(filter&&!norm(prov).includes(filter))return;
        const pOpen=(expProv===prov);
        html+='<div class="it prov'+(pOpen?' open':'')+'" data-pro="'+prov+'">'+prov+' <small style="font-weight:400;color:#94a3b8">('+ARBOL[dep][prov].length+')</small></div>';
        if(pOpen)ARBOL[dep][prov].forEach(d=>{html+='<div class="it dist" data-d="'+encodeURIComponent(JSON.stringify(d))+'">'+d[0]+' <span class="ub">'+d[1]+'</span></div>';});
      });
    });
    navBody.innerHTML=html||'<div class="loading">Sin resultados.</div>';
