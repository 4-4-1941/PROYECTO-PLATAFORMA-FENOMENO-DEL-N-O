<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <title>Anticipación El Niño · Explorador territorial</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIINfQ3O9rV4W2rj1wJ5n5mY8Q5Z2Z5X5n0="
    crossorigin=""
  >
  <link rel="stylesheet" href="css/styles.css">
</head>

<body>
  <div id="map"></div>

  <button id="toggleNav" type="button" title="Panel" aria-label="Abrir o cerrar panel">≣</button>

  <div id="nav">
    <div id="navHead">
      <h1>Anticipación El Niño</h1>
      <p>Explorador territorial · Perú</p>
      <div class="copy">© SIP SYSTEM INTELLIGENCE PLATFORM 2026</div>

      <div class="q-wrap">
        <input
          id="q"
          type="search"
          placeholder="Buscar departamento, provincia, distrito, UBIGEO o caserío…"
          autocomplete="off"
          autocapitalize="none"
          spellcheck="false"
          aria-label="Buscar territorio"
        >
        <button class="q-x" id="qX" type="button" title="Limpiar búsqueda" aria-label="Limpiar búsqueda">&times;</button>
      </div>

      <div id="searchStatus" class="search-status" aria-live="polite"></div>
    </div>

    <div id="navBody">
      <div class="loading">Cargando territorios…</div>
    </div>
  </div>

  <div id="detalle" role="dialog" aria-modal="true" aria-hidden="true" aria-labelledby="dtT">
    <button class="dX" id="dX" type="button" title="Cerrar detalle" aria-label="Cerrar detalle">&times;</button>

    <div class="t" id="dtT"></div>
    <div class="s" id="dtS"></div>
    <span class="b" id="dtB"></span>
    <div class="d" id="dtD"></div>
    <div class="a" id="dtA"></div>

    <button id="backQuery" class="back-query" type="button">Volver a búsqueda</button>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""></script>

  <script>
    /*
     * DATOS:
     * El generador del proyecto debe sustituir __ARBOL__ por un objeto JSON/JS válido.
     *
     * Formato territorial compatible:
     * {
     *   "DEPARTAMENTO": {
     *     "PROVINCIA": [
     *       ["Distrito", "UBIGEO", lat, lon]
     *     ]
     *   }
     * }
     *
     * También se aceptan objetos de distrito:
     * {
     *   nombre: "...", ubigeo: "...", lat: -9, lon: -77,
     *   caserios: [{nombre:"...", ubigeo:"..."}]
     * }
     */
    const ARBOL = __ARBOL__;

    (function () {
      'use strict';

      const map = L.map('map', {
        zoomControl: true,
        preferCanvas: true
      }).setView([-9.5, -75], 5);

      const baseLayer = L.tileLayer(
        'https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png',
        {
          maxZoom: 19,
          attribution: '© OpenStreetMap © CARTO',
          subdomains: 'abcd',
          r: '@2x'
        }
      ).addTo(map);

      /*
       * PUNTO DE INTEGRACIÓN DE PRECIPITACIONES
       * No se elimina ninguna capa meteorológica que el repositorio ya agregue
       * por otro script. Si existe window.PRECIPITATION_LAYER o
       * window.precipitationLayer, se conserva y se añade al mapa.
       */
      let precipitationLayer = null;

      function restorePrecipitationLayer() {
        const candidate =
          window.PRECIPITATION_LAYER ||
          window.precipitationLayer ||
          window.rainLayer ||
          null;

        if (candidate && typeof candidate.addTo === 'function') {
          precipitationLayer = candidate;
          if (!map.hasLayer(precipitationLayer)) precipitationLayer.addTo(map);
        }
      }

      window.addEventListener('load', restorePrecipitationLayer);

      const navBody = document.getElementById('navBody');
      const qi = document.getElementById('q');
      const nav = document.getElementById('nav');
      const detallePanel = document.getElementById('detalle');
      const qX = document.getElementById('qX');
      const dX = document.getElementById('dX');
      const backQuery = document.getElementById('backQuery');
      const toggleNav = document.getElementById('toggleNav');
      const searchStatus = document.getElementById('searchStatus');

      let expDep = null;
      let expProv = null;
      let lastSearchHadResults = false;

      function norm(value) {
        return String(value ?? '')
          .toUpperCase()
          .normalize('NFD')
          .replace(/[\u0300-\u036f]/g, '')
          .replace(/[^A-Z0-9]/g, '');
      }

      function safeText(value) {
        return String(value ?? '');
      }

      function districtRecord(raw) {
        if (Array.isArray(raw)) {
          return {
            nombre: raw[0],
            ubigeo: raw[1],
            lat: raw[2],
            lon: raw[3],
            caserios: raw[4] || []
          };
        }
        return {
          nombre: raw?.nombre ?? raw?.name ?? '',
          ubigeo: raw?.ubigeo ?? raw?.UBIGEO ?? '',
          lat: raw?.lat ?? raw?.latitud ?? raw?.latitude,
          lon: raw?.lon ?? raw?.longitud ?? raw?.longitude,
          caserios: raw?.caserios ?? raw?.caserios ?? []
        };
      }

      function matchesDistrict(d, filter) {
        if (!filter) return true;
        const x = districtRecord(d);
        if (norm(x.nombre).includes(filter)) return true;
        if (norm(x.ubigeo).includes(filter)) return true;

        return (Array.isArray(x.caserios) ? x.caserios : []).some(c => {
          const nombre = Array.isArray(c) ? c[0] : (c?.nombre ?? c?.name ?? '');
          const ubigeo = Array.isArray(c) ? c[1] : (c?.ubigeo ?? c?.UBIGEO ?? '');
          return norm(nombre).includes(filter) || norm(ubigeo).includes(filter);
        });
      }

      function searchMatches(filter) {
        const results = [];

        Object.keys(ARBOL || {}).forEach(dep => {
          const depMatch = !filter || norm(dep).includes(filter);

          Object.keys(ARBOL[dep] || {}).forEach(prov => {
            const provMatch = !filter || norm(prov).includes(filter);

            (ARBOL[dep][prov] || []).forEach(raw => {
              const d = districtRecord(raw);
              if (depMatch || provMatch || matchesDistrict(raw, filter)) {
                results.push({
                  dep,
                  prov,
                  raw,
                  district: d
                });
              }
            });
          });
        });

        return results;
      }

      function abrirDetalle() {
        detallePanel.classList.add('show');
        detallePanel.setAttribute('aria-hidden', 'false');

        if (window.innerWidth <= 720) {
          nav.classList.add('closed');
        }

        requestAnimationFrame(() => {
          dX.focus();
        });
      }

      function cerrarDetalle() {
        detallePanel.classList.remove('show');
        detallePanel.setAttribute('aria-hidden', 'true');
      }

      function limpiarConsulta(focus = true) {
        cerrarDetalle();
        qi.value = '';
        qX.classList.remove('show');
        searchStatus.textContent = '';
        expDep = null;
        expProv = null;
        lastSearchHadResults = false;
        render();
        if (focus) {
          nav.classList.remove('closed');
          setTimeout(() => qi.focus(), 50);
        }
      }

      function mostrarDetalle(titulo, subtitulo, color, etiqueta, detalleHtml, alertaHtml) {
        document.getElementById('dtT').textContent = titulo || '';
        document.getElementById('dtS').textContent = subtitulo || '';

        const badge = document.getElementById('dtB');
        badge.textContent = etiqueta || '';
        badge.className = 'b ' + (color || '');

        document.getElementById('dtD').textContent = '';
        document.getElementById('dtD').innerHTML = detalleHtml || '';

        document.getElementById('dtA').textContent = '';
        document.getElementById('dtA').innerHTML = alertaHtml || '';

        abrirDetalle();
      }

      function render() {
        const filter = norm(qi.value);
        let html = '';
        let visibleCount = 0;

        Object.keys(ARBOL || {}).forEach(dep => {
          const depObj = ARBOL[dep] || {};
          const depDirectMatch = !filter || norm(dep).includes(filter);

          const provinceMatches = Object.keys(depObj).filter(prov => {
            if (depDirectMatch || !filter || norm(prov).includes(filter)) return true;
            return (depObj[prov] || []).some(d => matchesDistrict(d, filter));
          });

          if (filter && provinceMatches.length === 0) return;

          const depAbierto = expDep === dep || Boolean(filter && provinceMatches.length);
          visibleCount++;

          html += '<div class="it dep ' + (depAbierto ? 'open' : '') + '" data-nom="' + encodeURIComponent(dep) + '">' +
            safeText(dep) + '</div>';

          if (!depAbierto) return;

          Object.keys(depObj).forEach(prov => {
            const provObj = depObj[prov] || [];
            const provDirectMatch = !filter || norm(prov).includes(filter) || depDirectMatch;
            const districtMatches = provObj.filter(d => matchesDistrict(d, filter));

            if (filter && !provDirectMatch && districtMatches.length === 0) return;

            const provinciaAbierta =
              expProv === dep + '|' + prov ||
              Boolean(filter && (districtMatches.length || provDirectMatch));

            html += '<div class="it prov ' + (provinciaAbierta ? 'open' : '') +
              '" data-pro="' + encodeURIComponent(dep + '|' + prov) + '">' +
              safeText(prov) + ' (' + provObj.length + ')</div>';

            if (!provinciaAbierta) return;

            provObj.forEach(raw => {
              if (filter && !provDirectMatch && !matchesDistrict(raw, filter)) return;

              const d = districtRecord(raw);
              visibleCount++;

              html += '<div class="it dist" data-d="' +
                encodeURIComponent(JSON.stringify(raw)) + '">' +
                '<span>' + safeText(d.nombre) + '</span>' +
                '<span class="ub">' + safeText(d.ubigeo) + '</span>' +
                '</div>';
            });
          });
        });

        navBody.innerHTML = html || '<div class="loading">Sin resultados.</div>';

        if (filter) {
          const matches = searchMatches(filter);
          lastSearchHadResults = matches.length > 0;
          searchStatus.textContent = matches.length
            ? matches.length + (matches.length === 1 ? ' coincidencia territorial' : ' coincidencias territoriales')
            : 'No se encontraron coincidencias.';
        } else {
          lastSearchHadResults = false;
          searchStatus.textContent = '';
        }

        navBody.querySelectorAll('.it.dep').forEach(element => {
          element.addEventListener('click', () => {
            expDep = decodeURIComponent(element.dataset.nom);
            expProv = null;
            render();
          });
        });

        navBody.querySelectorAll('.it.prov').forEach(element => {
          element.addEventListener('click', () => {
            const key = decodeURIComponent(element.dataset.pro);
            expProv = expProv === key ? null : key;
            render();
          });
        });

        navBody.querySelectorAll('.it.dist').forEach(element => {
          element.addEventListener('click', () => {
            const raw = JSON.parse(decodeURIComponent(element.dataset.d));
            const d = districtRecord(raw);

            const latitud = Number(d.lat);
            const longitud = Number(d.lon);
            const coordsValid =
              Number.isFinite(latitud) &&
              Number.isFinite(longitud) &&
              Math.abs(latitud) <= 90 &&
              Math.abs(longitud) <= 180;

            if (coordsValid) {
              map.setView([latitud, longitud], 13, { animate: true });
            }

            const coordenadas = coordsValid
              ? '<b>Coordenadas:</b> ' + latitud + ', ' + longitud
              : '<b>Coordenadas:</b> no disponibles para este registro.';

            mostrarDetalle(
              d.nombre,
              'Distrito · UBIGEO ' + (d.ubigeo || 'no disponible'),
              'verde',
              'VIGILANCIA',
              coordenadas,
              'La información de precipitación debe mantenerse en la capa meteorológica del proyecto y cruzarse con este territorio.'
            );
          });
        });
      }

      function ejecutarBusqueda() {
        const filter = norm(qi.value);

        if (!filter) {
          limpiarConsulta();
          return;
        }

        const matches = searchMatches(filter);

        if (!matches.length) {
          expDep = null;
          expProv = null;
          render();
          return;
        }

        /*
         * Si la búsqueda corresponde a un distrito/UBIGEO/caserío,
         * se selecciona automáticamente la primera coincidencia.
         * Esto evita obligar al usuario móvil a navegar por varios niveles.
         */
        const exact = matches.find(m =>
          norm(m.district.nombre) === filter ||
          norm(m.district.ubigeo) === filter
        );

        if (exact) {
          expDep = exact.dep;
          expProv = exact.dep + '|' + exact.prov;
          render();

          const d = exact.district;
          const lat = Number(d.lat);
          const lon = Number(d.lon);

          if (Number.isFinite(lat) && Number.isFinite(lon)) {
            map.setView([lat, lon], 13, { animate: true });
          }

          mostrarDetalle(
            d.nombre,
            'Distrito · UBIGEO ' + (d.ubigeo || 'no disponible'),
            'verde',
            'VIGILANCIA',
            Number.isFinite(lat) && Number.isFinite(lon)
              ? '<b>Coordenadas:</b> ' + lat + ', ' + lon
              : '<b>Coordenadas:</b> no disponibles para este registro.',
            'La capa de precipitaciones permanece independiente del panel de búsqueda.'
          );
          return;
        }

        expDep = matches[0].dep;
        expProv = matches[0].dep + '|' + matches[0].prov;
        render();
      }

      qi.addEventListener('input', () => {
        qX.classList.toggle('show', qi.value.length > 0);
        render();
      });

      qi.addEventListener('keydown', event => {
        if (event.key === 'Enter') {
          event.preventDefault();
          ejecutarBusqueda();
        }
      });

      qX.addEventListener('click', () => limpiarConsulta());
      dX.addEventListener('click', cerrarDetalle);

      backQuery.addEventListener('click', () => {
        /*
         * En móvil "Volver a búsqueda" ahora cierra el detalle,
         * limpia la consulta y vuelve a abrir el panel.
         * No recarga la página ni destruye el mapa/capas.
         */
        limpiarConsulta(true);
      });

      toggleNav.addEventListener('click', () => {
        nav.classList.toggle('closed');
        if (!nav.classList.contains('closed')) {
          setTimeout(() => qi.focus(), 100);
        }
      });

      document.addEventListener('keydown', event => {
        if (event.key === 'Escape') {
          if (detallePanel.classList.contains('show')) {
            cerrarDetalle();
          } else if (qi.value) {
            limpiarConsulta(false);
          }
        }
      });

      /*
       * Al cerrar el detalle, el mapa queda intacto.
       * Esto es deliberado: no se vuelve a crear el mapa y no se elimina
       * ninguna capa meteorológica.
       */
      map.on('layeradd', restorePrecipitationLayer);

      cerrarDetalle();
      render();
    })();
  </script>
</body>
</html>
